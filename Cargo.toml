[workspace]
resolver = "3"
members = [
    "crates/gossamer-abi",
    "crates/gossamer-ast",
    "crates/gossamer-binding",
    "crates/gossamer-binding-macros",
    "crates/gossamer-cli",
    "crates/gossamer-codegen-cranelift",
    "crates/gossamer-codegen-llvm",
    "crates/gossamer-coro",
    "crates/gossamer-diagnostics",
    "crates/gossamer-driver",
    "crates/gossamer-hir",
    "crates/gossamer-http3",
    "crates/gossamer-interp",
    "crates/gossamer-lex",
    "crates/gossamer-lint",
    "crates/gossamer-lsp",
    "crates/gossamer-mcp",
    "crates/gossamer-mir",
    "crates/gossamer-parse",
    "crates/gossamer-pkg",
    "crates/gossamer-playground",
    "crates/gossamer-resolve",
    "crates/gossamer-runner-template",
    "crates/gossamer-runtime",
    "crates/gossamer-sched",
    "crates/gossamer-std",
    "crates/gossamer-template",
    "crates/gossamer-types",
    "crates/gossamer-ws",
    "xtask",
]
exclude = [
    "crates/gossamer-driver/tests/fixtures",
    "example-external-libraries",
]

[workspace.package]
version = "0.60.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/gossamer-lang/gossamer"
authors = ["Gossamer contributors"]

[workspace.lints.rust]
# `unsafe_code = "deny"` rather than `forbid` so individual sites
# in crates that legitimately need it (runtime / std / interp /
# codegen / binding) can opt in via `#[allow(unsafe_code)]` at
# the smallest possible scope without each crate having to
# re-list every workspace lint in a manual override (Cargo's
# `[lints]` table is replace-only). Crates with zero unsafe
# need no override - they just don't write `#[allow]` and
# `deny` rejects unannotated unsafe everywhere else.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# The remaining `allow`s trade off rigor for practicality:
#   - match_same_arms fires on coincidentally-identical arms whose
#     independence matters for readability (enum variants handled
#     individually).
#   - needless_pass_by_value and unused_self are good general advice
#     but fire on trait-method shapes we can't change.
#   - cast_possible_truncation / cast_precision_loss / cast_sign_loss
#     fire constantly in the lexer / parser / codegen where the
#     surrounding logic already bounds the cast.
#   - float_cmp fires on tests that compare constants for exact
#     equality - legitimate for deterministic helpers like SplitMix64.
match_same_arms = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
unreadable_literal = "allow"
format_push_string = "allow"
# Allow nested `if let` / `if cond { if let … }` over the
# 1.88+ let-chain syntax. The existing codebase consistently
# uses the explicit nested form for the symmetry it offers
# with `match` arms, and rewriting every site is a churn we
# don't want to take on for a stylistic preference.
collapsible_if = "allow"

[workspace.dependencies]
gossamer-abi = { path = "crates/gossamer-abi", version = "0.60.2" }
gossamer-ast = { path = "crates/gossamer-ast", version = "0.60.2" }
gossamer-binding = { path = "crates/gossamer-binding", version = "0.60.2" }
gossamer-binding-macros = { path = "crates/gossamer-binding-macros", version = "0.60.2" }
gossamer-codegen-cranelift = { path = "crates/gossamer-codegen-cranelift", version = "0.60.2" }
gossamer-codegen-llvm = { path = "crates/gossamer-codegen-llvm", version = "0.60.2" }
gossamer-coro = { path = "crates/gossamer-coro", version = "0.60.2" }
gossamer-diagnostics = { path = "crates/gossamer-diagnostics", version = "0.60.2" }
gossamer-driver = { path = "crates/gossamer-driver", version = "0.60.2" }
gossamer-hir = { path = "crates/gossamer-hir", version = "0.60.2" }
gossamer-http3 = { path = "crates/gossamer-http3", version = "0.60.2" }
gossamer-interp = { path = "crates/gossamer-interp", version = "0.60.2" }
gossamer-lex = { path = "crates/gossamer-lex", version = "0.60.2" }
gossamer-lint = { path = "crates/gossamer-lint", version = "0.60.2" }
gossamer-lsp = { path = "crates/gossamer-lsp", version = "0.60.2" }
gossamer-mcp = { path = "crates/gossamer-mcp", version = "0.60.2" }
gossamer-mir = { path = "crates/gossamer-mir", version = "0.60.2" }
gossamer-parse = { path = "crates/gossamer-parse", version = "0.60.2" }
gossamer-pkg = { path = "crates/gossamer-pkg", version = "0.60.2" }
gossamer-resolve = { path = "crates/gossamer-resolve", version = "0.60.2" }
gossamer-runner-template = { path = "crates/gossamer-runner-template", version = "0.60.2" }
gossamer-runtime = { path = "crates/gossamer-runtime", version = "0.60.2" }
gossamer-sched = { path = "crates/gossamer-sched", version = "0.60.2" }
gossamer-std = { path = "crates/gossamer-std", version = "0.60.2" }
gossamer-template = { path = "crates/gossamer-template", version = "0.60.2" }
gossamer-types = { path = "crates/gossamer-types", version = "0.60.2" }
gossamer-ws = { path = "crates/gossamer-ws", version = "0.60.2" }

anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
indexmap = "2"
insta = { version = "1", features = ["yaml"] }
linkme = "0.3"
mio = { version = "1", features = ["os-poll", "net"] }
parking_lot = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
thiserror = "2"
toml = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jpeg-encoder = "0.6"
png = "0.18"
ureq = "3"
unicode-ident = "1"
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
unicode-segmentation = "1"
wait-timeout = "0.2"
which = "8"

# `panic` must stay `unwind` (the default): goroutine fault isolation
# and `spawn(f)`/`handle.join()` error delivery both work by unwinding
# from `gos_rt_panic` through `panic_any` to the coroutine wrapper's
# catch. With `panic = "abort"` the runtime staticlib (built with this
# profile by gossamer-cli's build script) turned every contained
# goroutine panic in a `--release` binary into SIGABRT.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
incremental = false

[profile.release.package.cranelift-codegen]
opt-level = "s"

[profile.release.package.cranelift-frontend]
opt-level = "s"

[profile.release.package.cranelift-jit]
opt-level = "s"

[profile.release.package.cranelift-module]
opt-level = "s"

[profile.release.package.cranelift-native]
opt-level = "s"

[profile.release.package.regalloc2]
opt-level = "s"

[profile.release.package.gossamer-codegen-cranelift]
opt-level = "s"

[profile.release.package.gossamer-runtime]
opt-level = 3

[profile.release.package.gossamer-std]
opt-level = 3
