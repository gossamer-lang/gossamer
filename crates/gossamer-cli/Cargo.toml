[package]
name = "gossamer-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line entry point for the Gossamer toolchain."

[lib]
name = "gossamer_cli"
path = "src/lib.rs"

[[bin]]
name = "gos"
path = "src/main.rs"

[lints]
workspace = true

[package.metadata.deb]
name = "gossamer"
maintainer = "Gossamer contributors"
copyright = "2026, Gossamer contributors"
license-file = ["../../LICENSE", "4"]
extended-description = """
Gossamer is a garbage-collected, goroutine-powered, fast-compiling
language with Rust-flavoured syntax. The `gos` toolchain
ships the parser, type-checker, interpreter, linter, formatter,
LSP adapter, doc generator, and test/bench harness as one binary."""
section = "devel"
priority = "optional"
# Use the literal `target/release/` prefix even for cross-compile.
# cargo-deb / cargo-generate-rpm rewrite this prefix to
# `target/<triple>/release/` automatically when `--target` is
# passed; cargo-deb actively rejects hardcoded cross-compile paths
# (`Please only use target/release path prefix...`).
assets = [
    ["target/release/gos", "usr/bin/", "755"],
    ["target/release/libgossamer_runtime.a", "usr/lib/", "644"],
    ["target/release/libgossamer_runtime-musl.a", "usr/lib/", "644"],
    ["../../README.md", "usr/share/doc/gossamer/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "gossamer"
license = "Apache-2.0"
summary = "Gossamer toolchain - parser, checker, interpreter, and tooling"
assets = [
    { source = "target/release/gos", dest = "/usr/bin/gos", mode = "755" },
    { source = "target/release/libgossamer_runtime.a", dest = "/usr/lib/libgossamer_runtime.a", mode = "644" },
    { source = "target/release/libgossamer_runtime-musl.a", dest = "/usr/lib/libgossamer_runtime-musl.a", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/gossamer/README.md", mode = "644" },
]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
gossamer-ast = { workspace = true }
gossamer-codegen-llvm = { workspace = true }
gossamer-coro = { workspace = true }
gossamer-diagnostics = { workspace = true }
# `musl` registers the `*-unknown-linux-musl` triples so `gos build
# --target <musl-triple>` works out of the box. The driver gates them
# off by default to avoid confusing link failures, but the CLI resolves
# a missing musl runtime archive with a clear, actionable error
# (find_runtime_lib_for_target), so recognising the triple is the better
# behaviour here.
gossamer-driver = { workspace = true, features = ["musl"] }
gossamer-hir = { workspace = true }
gossamer-interp = { workspace = true }
gossamer-lex = { workspace = true }
gossamer-lint = { workspace = true }
gossamer-lsp = { workspace = true }
gossamer-mcp = { workspace = true }
gossamer-parse = { workspace = true }
gossamer-pkg = { workspace = true }
gossamer-resolve = { workspace = true }
gossamer-runtime = { workspace = true }
gossamer-types = { workspace = true }
parking_lot = { workspace = true }
rustyline = { version = "18", default-features = false, features = ["custom-bindings", "with-file-history"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
terminal_size = "0.4"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
which = { workspace = true }

gossamer-std = { workspace = true }

[dev-dependencies]
gossamer-abi = { workspace = true }
# In-process HTTP/2 conformance test consumes the h2 crate's
# client side and drives the Gossamer h2 server through it.
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[features]
# Opt-in flag the integration suites consult to enable their full
# walks. Default `cargo test` runs minimal smoke variants so the
# suite stays under a minute; `exhaustive_test.sh` passes
# `--features exhaustive_tests` to flip every gated test on.
exhaustive_tests = []
# Forward the VM's optional opcode profiler so real CLI workloads can be
# measured with `cargo run -p gossamer-cli --features profile`.
profile = ["gossamer-interp/profile"]
# Inline Vec capacity passthroughs. Keep the runtime archive built by build.rs
# in lock-step with the CLI/VM runtime feature so `gos build --release` and
# `gos` compare the same inline Vec capacity.
inline-vec-words-6 = ["gossamer-runtime/inline-vec-words-6"]
inline-vec-words-8 = ["gossamer-runtime/inline-vec-words-8"]
