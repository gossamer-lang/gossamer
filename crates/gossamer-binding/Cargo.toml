[package]
name = "gossamer-binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Stable Rust-binding system for Gossamer libraries."

[lints.rust]
# The C entry points, the host table, and the wire thunks need `unsafe`;
# `deny` lets those modules opt in while every other module rejects it.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
match_same_arms = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
unreadable_literal = "allow"
format_push_string = "allow"
collapsible_if = "allow"
# Phase 1/2 BindingAbi impls repeat the same `match <single_payload>
# { Some(x) => x, None => return Err(...) }` shape across every
# wire-shape. Rewriting to `let-else` or `?` would obscure the per-
# arm return value (which varies - `Err(GosError::new(""))` vs
# `Err(String::new())` vs `return None`).
question_mark = "allow"
manual_let_else = "allow"
explicit_iter_loop = "allow"
doc_markdown = "allow"

[dependencies]
gossamer-binding-abi = { workspace = true }
gossamer-binding-macros = { workspace = true }
linkme = "0.3"
pastey = "0.1"
parking_lot = "0.12"
rustc-hash = "2"
