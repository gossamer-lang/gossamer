[package]
name = "gossamer-interp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bytecode interpreter and adaptive JIT runtime for the Gossamer language."

[lints]
workspace = true

[dependencies]
itoa = "1"
gossamer-abi = { workspace = true }
gossamer-ast = { workspace = true }
gossamer-coro = { workspace = true }
gossamer-hir = { workspace = true }
gossamer-lex = { workspace = true }
gossamer-mir = { workspace = true }
gossamer-resolve = { workspace = true }
gossamer-runtime = { workspace = true }
gossamer-std = { workspace = true }
gossamer-types = { workspace = true }
gossamer-ws = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = "2"
sha2 = { workspace = true }
smallvec = "1"
thiserror = { workspace = true }

# The in-process Cranelift JIT is an optimisation only and Cranelift
# does not target wasm32-unknown-unknown. On wasm the interpreter links
# a no-op JIT stub (`src/jit_stub.rs`) that always declines to compile,
# so the bytecode VM runs everything. Native is unaffected.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gossamer-codegen-cranelift = { workspace = true }

# The JIT admission policy samples the process RSS before compiling native
# code. Linux reads procfs; macOS, FreeBSD, and Windows need their platform APIs.
[target.'cfg(any(target_os = "macos", target_os = "freebsd"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
default = []
profile = []
# Execution budget for the dispatch loop (loop back-edge counting). Off by
# default so native `gos` pays nothing; the wasm playground enables it.
fuel = []

[dev-dependencies]
gossamer-parse = { workspace = true }
