[package]
name = "gossamer-codegen-cranelift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cranelift-backed codegen for the Gossamer compiler."

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
backtrace = "0.3"
gossamer-abi = { workspace = true }
cranelift-codegen = "=0.134.2"
cranelift-frontend = "=0.134.2"
cranelift-jit = "=0.134.2"
cranelift-module = "=0.134.2"
cranelift-object = "=0.134.2"
cranelift-native = "=0.134.2"
gossamer-hir = { workspace = true }
gossamer-lex = { workspace = true }
gossamer-mir = { workspace = true }
gossamer-runtime = { workspace = true }
gossamer-types = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
region = "3.0.2"
wasmtime-jit-icache-coherence = { package = "wasmtime-internal-jit-icache-coherence", version = "=47.0.2" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[dev-dependencies]
object = { version = "0.39", default-features = false, features = ["read"] }
target-lexicon = "0.13"
gossamer-ast = { workspace = true }
gossamer-hir = { workspace = true }
gossamer-lex = { workspace = true }
gossamer-parse = { workspace = true }
gossamer-resolve = { workspace = true }
