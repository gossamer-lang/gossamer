cranelift-jit = "=0.134.2"
cranelift-module = "=0.134.2"
cranelift-object = "=0.134.2"
cranelift-native = "=0.134.2"
gossamer-hir = { workspace = true }
gossamer-lex = { workspace = true }
gossamer-mir = { workspace = true }
gossamer-runtime = { workspace = true }
gossamer-types = { workspace = true }
linkme = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
object = { version = "0.39", default-features = false, features = ["read"] }
target-lexicon = "0.13"
gossamer-ast = { workspace = true }
gossamer-hir = { workspace = true }
gossamer-lex = { workspace = true }
gossamer-parse = { workspace = true }
