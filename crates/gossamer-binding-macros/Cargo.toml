[package]
name = "gossamer-binding-macros"
# The binding SDK is versioned by its own API, not by the compiler: a
# binding's `gossamer-binding = "0.75.x"` requirement matches every toolchain
# whose SDK keeps that API. Bump the minor version only on a breaking change
# to the binding API.
version = "0.75.19"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Proc-macros powering gossamer-binding's #[gos_module] / #[gos_opaque] / #[gos_blocking] / #[derive(GosStruct)]."

[lib]
proc-macro = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
