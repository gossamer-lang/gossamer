[package]
name = "gossamer-std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Standard library for the Gossamer language."

[lints]
workspace = true

# Gossamer standard library modules are NEVER feature-gated. Every
# module in this crate is part of the language surface and always
# compiled. Consumers depend on `gossamer-std` plain - no feature
# selection - so that a script using `std::tls` or `std::crypto`
# always works regardless of the host build.

# Pure-Rust dependencies that build for wasm32-unknown-unknown. The
# wasm playground links these unchanged; the I/O / crypto / network
# stdlib modules that need native crates are gated out (see lib.rs).
[dependencies]
gossamer-pkg = { workspace = true }
gossamer-runtime = { workspace = true }
gossamer-sched = { workspace = true }
gossamer-coro = { workspace = true }
gossamer-template = { workspace = true }
gossamer-ws = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }

# Regular expressions (`std::regex`).
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }

# Compression (`std::compress::{gzip,flate,zlib}`). The pure-Rust
# `flate2` rust_backend covers gzip/flate/zlib on every target; the C
# `bzip2`/`zstd` codecs are native-only (gated below).
flate2 = { workspace = true }

# HTTP message types (`std::http`) - pure wire types, no I/O.
http = "1"
bytes = "1"

# Pure-Rust hash / cipher primitives used by `std::crypto`. They build
# for wasm even though the `crypto` module that calls them is gated out
# (none enables an OS-RNG feature, so none pulls getrandom). The
# password-hash KDFs (argon2/pbkdf2/scrypt) DO pull a salt RNG via
# `password-hash`, so they live in the native-only table below.
x509-parser = "0.18"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
blake3 = { version = "1", default-features = false, features = ["std"] }
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
ctr = "0.9"
# Legacy / insecure crypto (`std::crypto::insecure`): MD5, SHA1.
md-5 = { version = "0.10", default-features = false, features = ["std"] }
sha1 = { version = "0.10", default-features = false, features = ["std"] }

# Encodings (`std::encoding::{xml,yaml}`). `serde_norway` is the
# maintained fork of the archived `serde_yaml`, API-compatible.
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = "0.9"
quick-xml = "0.41"

# Archive readers/writers (`std::archive::{zip,tar}`).
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"

# Arbitrary-precision integers (`std::math::big`).
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

# User-facing TOML (`std::encoding::toml`). Used internally for
# project.toml by gossamer-pkg; now exposed to user code.
toml = { workspace = true }

# Media type parsing (`std::mime`).
mime = "0.3"
mime_guess = "2"

# Unicode property tables (`std::unicode`). Real general-category
# tests, normalization forms, and grapheme/word/sentence
# segmentation - replaces the hand-rolled ASCII-only stubs that
# shipped through 0.7.0. Platform-agnostic; pure Rust.
unicode-properties = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }

# Native-only dependencies. These link C (ring, bzip2, zstd), require
# OS sockets/signals/poll/fs primitives (mio, socket2, signal-hook,
# notify, memmap2, nix), pull an OS RNG (getrandom, uuid,
# ed25519-dalek, p256, aes-gcm, chacha20poly1305, rand_core), or drive
# the native HTTP/TLS/QUIC stack (rustls, ureq, h2, tokio, tokio-rustls,
# gossamer-http3) - none of which build for wasm32-unknown-unknown. The
# stdlib modules that use them are gated out of the wasm build; native
# (cfg-not-wasm always true) keeps the identical set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mio = { workspace = true }
signal-hook = { workspace = true }
# socket2 provides SO_KEEPALIVE access not exposed by std::net.
socket2 = "0.6"
# backtrace powers `std::runtime::caller` / `std::runtime::stack`
# resolving function names + file/line via DWARF when available.
backtrace = "0.3"

# TLS surface (`std::tls`). Rustls + bundled Mozilla roots.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# C-backed compression codecs (`std::compress::{bzip2,zstd}`).
bzip2 = { version = "0.5", features = ["static"] }
zstd = "0.13"

# File-system watching (`std::fs::watch`), memory mapping
# (`std::fs::mmap`), and advisory file locks (`std::fs::lock`).
notify = "8"
memmap2 = "0.9"

# RSA verify / sign for `std::jwt` and constant-time crypto primitives.
ring = "0.17"

# HTTP/2 stack (h2 crate, io-util traits only).
h2 = "0.4"
tokio = { version = "1", default-features = false, features = ["io-util"] }

# HTTP/3 stack (`std::http_h3`) - QUIC + h3 engine.
gossamer-http3 = { workspace = true }

# OS-RNG-backed crypto (`std::crypto`) and UUID v4/v7 generation.
# argon2/pbkdf2/scrypt pull a salt RNG (getrandom) via `password-hash`.
getrandom = "0.3"
pbkdf2 = { version = "0.12", default-features = false, features = ["std", "hmac"] }
scrypt = { version = "0.11", default-features = false, features = ["std"] }
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc", "password-hash"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pem"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "pkcs8", "pem", "rand_core"] }
rand_core = "0.6"
uuid = { version = "1", features = ["v4", "v7"] }

# Time-zone surface (`std::time::tz`).
chrono.workspace = true
chrono-tz.workspace = true

# HTTP client surface (`std::http::Client`). HTTPS, redirects, pool.
ureq = { workspace = true, features = ["cookies", "json"] }

# Raster image model and PNG/JPEG codecs (`std::image`). Keep the codecs
# narrowly scoped instead of enabling a broad image-format umbrella.
png = { workspace = true }
jpeg-decoder = "0.3"
jpeg-encoder = { workspace = true }

# POSIX user / group lookup (`std::os::user`).
nix = { version = "0.31", default-features = false, features = ["user", "fs", "process", "signal"] }

[dev-dependencies]
# Self-signed PEM keypair generation for native-client TLS tests.
# Never compiled into the shipped crate.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# The resolver validates `use std::module::Item` leaves against a
# checked-in copy of this crate's manifest; a test pins the two together.
gossamer-resolve = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Signal delivery + process-group control for `std::exec`.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Console control handler for `std::signal` (Ctrl+C / Ctrl+Break /
# close / logoff / shutdown). Mirrors the unix `signal-hook`
# dispatcher; no equivalent surface ships in std today.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }
