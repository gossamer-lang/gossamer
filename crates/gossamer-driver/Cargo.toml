[package]
name = "gossamer-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "High-level orchestration of the Gossamer compiler pipeline."

[lints]
workspace = true

[features]
# Default off: the host toolchain on most dev machines does not have
# a musl sysroot installed, so advertising musl targets lands users
# in a confusing failure when they try to cross-compile. Turn the
# feature on explicitly once a musl sysroot is available.
default = []
musl = []

[dependencies]
anyhow = { workspace = true }
gossamer-abi = { workspace = true }
gossamer-ast = { workspace = true }
gossamer-codegen-cranelift = { workspace = true }
gossamer-codegen-llvm = { workspace = true }
gossamer-diagnostics = { workspace = true }
gossamer-hir = { workspace = true }
gossamer-lex = { workspace = true }
gossamer-mir = { workspace = true }
gossamer-parse = { workspace = true }
gossamer-pkg = { workspace = true }
gossamer-resolve = { workspace = true }
gossamer-runner-template = { workspace = true }
gossamer-types = { workspace = true }
postcard = { version = "1", default-features = false, features = ["use-std"] }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
which = { workspace = true }

# Liveness probe for the advisory build-lock holder, so a stale lock from a
# crashed `gos` is reclaimed promptly instead of waiting out the deadline.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

