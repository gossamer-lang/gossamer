[package]
name = "gossamer-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Runtime support library linked into every Gossamer program."

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Inline Vec capacity build switches. Six words is the selected default from
# the 0.28 workload matrix; `inline-vec-words-6` is a compatibility no-op and
# `inline-vec-words-8` is the real opt-in so Cargo `--all-features` has one
# deterministic capacity.
inline-vec-words-6 = []
inline-vec-words-8 = []

# The runtime crate is unsafe by design - its C-ABI surface
# (`#[no_mangle] extern "C"` functions accepting raw pointers)
# is unsafe at every entry. Override the workspace `deny` to
# `allow` rather than annotate every fn individually.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
match_same_arms = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
unreadable_literal = "allow"
format_push_string = "allow"
collapsible_if = "allow"

# Pure-Rust dependencies that build for wasm32-unknown-unknown
# unchanged. The wasm playground links only the bytecode VM, but these
# crates compile cleanly there even when their consuming compiled-tier
# shim is gated out, so they stay in the unconditional table.
[dependencies]
itoa = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
parking_lot = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
flate2 = { workspace = true }
sha1 = { version = "0.10", default-features = false, features = ["std"] }
rustc-hash = "2"
indexmap = { workspace = true }
gossamer-coro = { workspace = true }
gossamer-pkg = { workspace = true }
gossamer-abi = { workspace = true }
gossamer-template = { workspace = true }
gossamer-ws = { workspace = true }
http = "1"
bytes = "1"
chrono.workspace = true
chrono-tz.workspace = true

# Unicode tables (`std::unicode` compiled-tier helpers). Same
# crates as gossamer-std so the property data is single-sourced
# (Unicode 16 via unicode-rs).
unicode-properties = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }

# User-facing TOML (`std::encoding::toml` compiled-tier helpers).
toml = { workspace = true }

# Media type parsing (`std::mime` compiled-tier helpers).
mime = "0.3"
mime_guess = "2"

# YAML codec - already used by gossamer-std; needed in runtime for
# auto-derive helpers. `serde_norway` is the maintained fork of the
# archived `serde_yaml`, API-compatible.
serde_norway = "0.9"
quick-xml = "0.41"

# Crypto digest helpers consumed by `c_abi::crypto` so the
# compiled tier can call `std::crypto::sha256` / `sha512` /
# `hmac` natively instead of paying a VM round-trip. (`blake3` moved
# to the native table - the wasm crypto shims are gated out.)
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# Same versions as gossamer-std so the compiled-tier x509 / tar / zip
# leaf intrinsics produce byte-identical results to the VM tier.
x509-parser = "0.18"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

# The browser has a clock; Rust's `std::time` shims for
# wasm32-unknown-unknown panic instead of reading it. `web-time` is the
# ecosystem's drop-in replacement, wired through `platform::{Instant,
# SystemTime}` so no other crate names the target.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

# Native-only dependencies. These either link C (mimalloc, zstd,
# bzip2, ring via rustls), require an OS RNG/signals/sockets/dynamic
# loader (getrandom, uuid, signal-hook, mio, libloading), or drive the
# native HTTP/QUIC stack (ureq, h2, tokio, gossamer-http3) - none of
# which build for wasm32-unknown-unknown. The compiled-tier shims that
# use them are gated out of the wasm VM build (see lib.rs / c_abi.rs);
# native (cfg-not-wasm is always true there) keeps the identical set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# AEAD + password-hashing crypto, used only by the compiled-tier
# `crypto_aead` / `crypto_extra` / `crypto` shims (all gated out of the
# wasm VM). aes-gcm/chacha20poly1305 default-enable `getrandom` (via
# `aead`) for nonce generation, which pulls getrandom 0.2 - unbuildable
# for wasm32 without the js backend - so they live here. Native keeps
# the identical set.
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc", "password-hash"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["std", "hmac"] }
scrypt = { version = "0.11", default-features = false, features = ["std"] }
md-5 = { version = "0.10", default-features = false, features = ["std"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
blake3 = { version = "1", default-features = false, features = ["std"] }
mimalloc = "0.1"
# Direct handle on the same native lib `mimalloc` links, with the
# `extended` bindings so the runtime can set `mi_option_purge_delay`
# (return freed pages to the OS promptly - see `configure_allocator`).
libmimalloc-sys = { version = "0.1", features = ["extended"] }
# Real machine-stack unwinding for compiled-tier panic / SIGQUIT
# backtraces. `std::backtrace` reports "unsupported" on the
# static-musl release target, so the standalone crate - which builds
# its unwinder into the binary against the linked `libunwind.a` - is
# the only mechanism that works on the default release link path.
backtrace = "0.3"
zstd = "0.13"
# `static` bundles the libbz2 C source into the archive rather than
# dynamically linking the system `-lbz2`. macOS otherwise resolves bzip2 to
# the SDK's libbz2 via pkg-config, and a `gos build` link (no `-lbz2` on the
# line) fails with undefined `_BZ2_*` symbols. Bundling keeps
# `libgossamer_runtime.a` self-contained on every platform.
bzip2 = { version = "0.5", features = ["static"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "pkcs8", "pem"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pem"] }
# RSA signature verification for the RS256 / RS384 / RS512 JWT family -
# what Auth0, Okta, Entra ID, Google, Cognito, and Keycloak mint. Same
# version and provider `rustls` already links, and verification only, so
# the compiled tier gains no key-generation surface.
ring = "0.17"
signal-hook = { workspace = true }
libloading = "0.8"
crossbeam-deque = { workspace = true }
mio = { workspace = true }
# `gos_rt_http_stream` uses ureq for the wire request so the
# compiled tier matches the interp's `http::stream` semantics.
# Same feature set as gossamer-std (TLS via rustls, gzip, cookies)
# for parity with `gos`.
ureq = { workspace = true, features = ["cookies"] }
png = { workspace = true }
jpeg-decoder = "0.3"
jpeg-encoder = { workspace = true }

# Raw TLS-over-socket (`net::TcpStream::start_tls`) for the compiled
# tier. Same rustls feature set + roots as gossamer-std's HTTP client
# so the upgraded stream verifies certificates identically on every
# tier (ring provider, webpki roots).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"

# HTTP/2 server compiled into libgossamer_runtime.a so
# `http2::bind_and_run_h2c` works under `gos build`. Tokio is
# pulled in for its `io-util` trait surface only (AsyncRead /
# AsyncWrite) - no runtime, no reactor; the goroutine scheduler
# drives futures via [`crate::http2_server::drive`].
h2 = "0.4"
tokio = { version = "1", default-features = false, features = ["io-util"] }

# HTTP/3 server + client (`std::http_h3` compiled-tier shim). The
# QUIC + h3 engine is shared with the interpreter via the standalone
# `gossamer-http3` crate; the C-ABI shim in `c_abi::http3` marshals
# the engine's wire types into the same `GosHttpRequest` /
# `GosHttpResponse` path the h1 / h2 servers use.
gossamer-http3 = { workspace = true }

# UUID generation (`std::uuid` compiled-tier helpers).
uuid = { version = "1", features = ["v4", "v7"] }

# OS RNG for `gos_rt_crypto_rand_bytes`.
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# POSIX user / group lookup for `std::os::user` compiled-tier helpers.
nix = { version = "0.31", default-features = false, features = ["user"] }

# Audit M21: Windows preemption uses QueueUserAPC. `windows-sys`
# is the lighter-weight binding (compared to `winapi`) and is
# already a transitive dependency via `mio` / `socket2`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
