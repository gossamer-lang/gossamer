[package]
name = "gossamer-binding-abi"
# The binding SDK is versioned by its own API, not by the compiler: a
# binding's `gossamer-binding = "0.75.x"` requirement matches every toolchain
# whose SDK keeps that API. Bump the minor version only on a breaking change
# to the binding API.
version = "0.75.19"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The C ABI between `gos` and the Rust binding libraries it loads."

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
