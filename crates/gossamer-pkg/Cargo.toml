[package]
name = "gossamer-pkg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Package manager for Gossamer."

[lints]
workspace = true

[features]
default = []
# Opt-in to the `synthetic_source_for_test` helper outside of unit
# tests (e.g. integration tests in `tests/`). Production crates must
# never enable this.
synthetic-source = []

[dependencies]
gossamer-lex = { workspace = true }
gossamer-resolve = { workspace = true }
thiserror = { workspace = true }

# Registry transport + signing crypto. None of these are used by the
# wasm playground (it links only `sha256`), and `rustls`/`ring` plus
# `ed25519-dalek`/`rand_core`/`getrandom` do not build for
# wasm32-unknown-unknown. Gated to native so the wasm build drops them;
# native (cfg-not-wasm is always true) keeps the exact same set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = "1"
sha2 = { workspace = true }
webpki-roots = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "rand_core", "hazmat"] }
rand_core = { version = "0.6", features = ["std", "getrandom"] }
parking_lot = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
url = "2"

# Owner-only DACL on the credentials file (the Windows equivalent of the
# POSIX `chmod 0600`). Bindings-only crate, no C build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }
