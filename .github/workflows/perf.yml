name: Perf gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # See ci.yml for the full explanation. rustup proxies are not
      # concurrent-safe (rustup#988); RUSTUP_TOOLCHAIN suppresses the
      # rust-toolchain.toml override-file read in every proxy
      # invocation, eliminating the rust-src download race.
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0

      - run: rustup set profile minimal
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          # `llvm.sh` is the LLVM project's own apt repository installer.
          # Ubuntu's archive stops several majors short of the one this
          # toolchain prefers, and the emitted IR's optimiser has to be
          # the major `rustc` bundles for its bitcode to be readable at
          # all - a mismatch there is a hard link error, not a slower
          # build.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

          echo "GOS_LLC=/usr/bin/llc-18" >> "$GITHUB_ENV"
          echo "GOS_LLVM_OPT=/usr/bin/opt-18" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}

      - name: Fingerprint perf runner CPU
        id: perf_cpu
        shell: bash
        run: |
          set -euo pipefail
          cpu_model=$(awk -F: '/^model name|^Processor/ {print $2; exit}' /proc/cpuinfo | xargs)
          [[ -n "$cpu_model" ]] || { echo "unable to identify runner CPU" >&2; exit 1; }
          fingerprint=$(printf '%s' "$cpu_model" | sha256sum | cut -c1-16)
          echo "model=$cpu_model"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore perf baseline
        id: restore-baseline
        uses: actions/cache@v6
        with:
          path: .perf/baseline.txt
          # Baseline is keyed to the main branch head. PRs restore the
          # most recent main baseline and compare against it; pushes to
          # main refresh it after a successful run. A cache can be evicted,
          # so the comparison step tolerates one baseline-seeding run.
          # Hosted ubuntu-latest spans materially different CPU generations.
          # Comparing their absolute ns/op values produces uniform false
          # regressions, so each CPU model maintains its own accepted baseline.
          key: perf-baseline-${{ runner.os }}-${{ steps.perf_cpu.outputs.fingerprint }}-${{ github.base_ref == '' && github.sha || 'main' }}
          restore-keys: |
            perf-baseline-${{ runner.os }}-${{ steps.perf_cpu.outputs.fingerprint }}-

      - name: Build release `gos`
        run: cargo build --release -p gossamer-cli

      - name: Idle CPU regression guard
        run: |
          "${GOS_HARNESS_BIN:-./target/release/gos}" run benchmarks/idle/check.gos

      - name: Release HTTP soak resource gate
        shell: bash
        run: |
          set -euo pipefail
          # Compile the stress target once, then measure the test executable
          # itself so cargo/rustc RSS is not mistaken for server retention.
          cargo test --release -p gossamer-cli --test http_load --no-run
          test_bin=$(find target/release/deps -maxdepth 1 -type f -name 'http_load-*' -perm -u+x | head -n 1)
          [[ -n "$test_bin" ]] || { echo "http_load release test binary missing" >&2; exit 1; }
          rss_file=$(mktemp)
          # This is a release-mode in-process server soak. Its test asserts
          # service ratio, clean shutdown, and panic isolation; this wrapper
          # adds a hard runtime/RSS ceiling for thread or request retention.
          GOSSAMER_LOAD_SECS=6 GOSSAMER_LOAD_WORKERS=8 \
            timeout 60s /usr/bin/time -f '%M' -o "$rss_file" \
            "$test_bin" --exact http_server_survives_concurrent_load_without_panicking --nocapture
          rss=$(tail -n 1 "$rss_file")
          rm -f "$rss_file"
          [[ "$rss" =~ ^[0-9]+$ ]] || { echo "invalid HTTP soak RSS: $rss" >&2; exit 1; }
          # 512 MiB leaves ample headroom for an instrumented hosted runner;
          # a leak or worker explosion crosses it quickly under this load.
          (( rss <= 524288 )) || { echo "HTTP soak RSS ${rss}KiB exceeds 512MiB cap" >&2; exit 1; }
          echo "HTTP soak peak RSS: ${rss}KiB"

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          GOS=./target/release/gos
          mkdir -p .perf

          # measure_process LABEL ARGS... records a smoke-test elapsed time and
          # the highest peak RSS across representative warm samples as
          # "LABEL <minimum-nanoseconds> <max-rss-kib>". Time isolates
          # catastrophic startup regressions; the RSS high-water catches
          # allocator and retention regressions that a timing gate misses.
          #
          # One discarded warmup run pages in the binary and primes the OS
          # cache; the fastest process sample is recorded because these smoke
          # programs are intentionally tiny and process launch noise dominates.
          # Real VM throughput is measured below with `gos bench`, which
          # calibrates inside the interpreter and reports ns/op.
          PERF_RUNS="${PERF_RUNS:-3}"
          measure_process() {
            local label=$1; shift
            "$@" >/dev/null 2>&1
            local i start end ns rss best= max_rss= rss_file
            for ((i = 0; i < PERF_RUNS; i++)); do
              rss_file=$(mktemp)
              start=$(date +%s%N)
              /usr/bin/time -f '%M' -o "$rss_file" "$@" >/dev/null 2>&1
              end=$(date +%s%N)
              ns=$((end - start))
              rss=$(tail -n1 "$rss_file")
              rm -f "$rss_file"
              [[ "$rss" =~ ^[0-9]+$ ]] || { echo "invalid RSS sample for $label" >&2; exit 1; }
              if [[ -z "$best" || "$ns" -lt "$best" ]]; then
                best=$ns
              fi
              if [[ -z "$max_rss" || "$rss" -gt "$max_rss" ]]; then
                max_rss=$rss
              fi
            done
            echo "$label $best $max_rss" | tee -a .perf/current.txt
          }

          rm -f .perf/current.txt

          # Calibrated VM throughput. Repeat the `gos bench` harness and record
          # the median ns/op per label so one lucky or unlucky hosted-runner
          # sample does not define the gate.
          BENCH_RUNS="${BENCH_RUNS:-3}"
          for ((i = 0; i < BENCH_RUNS; i++)); do
            "$GOS" bench benchmarks/perf --parallel 1 | tee ".perf/gos-bench-$i.txt"
          done
          "$GOS" run scripts/bench_median.gos .perf/gos-bench-*.txt | tee -a .perf/current.txt

          # Arithmetic-heavy: factorial via recursion
          [[ -f examples/factorial.gos ]] && measure_process factorial "$GOS" run examples/factorial.gos

          # String + I/O: hello world (baseline for interpreter startup)
          [[ -f examples/hello_world.gos ]] && measure_process hello_world "$GOS" run examples/hello_world.gos

          # Struct + field arithmetic: generic struct instantiation
          [[ -f examples/generic_struct.gos ]] && measure_process generic_struct "$GOS" run examples/generic_struct.gos

      - name: Compare against baseline
        shell: bash
        run: |
          set -euo pipefail
          GOS=./target/release/gos
          CURRENT=.perf/current.txt
          BASELINE=.perf/baseline.txt

          if [[ ! -f "$CURRENT" ]]; then
            echo "No benchmark results - skipping comparison."
            exit 0
          fi

          # Hard cap for process smoke tests and any absurd calibrated ns/op.
          awk '{
            if ($2 > 30000000000) {
              print "PERF ABORT: " $1 " took " int($2/1000000) "ms (> 30 s limit)"
              exit 1
            }
          }' "$CURRENT"

          if [[ ! -f "$BASELINE" ]]; then
            echo "No accepted perf baseline is available; hard caps passed and comparison is skipped."
            echo "The next successful push to main saves this run as the refreshed baseline."
            exit 0
          fi

          # Time and peak-RSS regression check. `bench:` lines are calibrated
          # ns/op from `gos bench` and gate VM throughput tightly. The legacy
          # process-smoke lines are tiny end-to-end programs, so they need a
          # larger absolute wall-clock delta before the ratio matters. Existing
          # two-column baselines remain readable; RSS begins gating once a
          # three-column baseline entry has been written on main.
          "$GOS" run scripts/perf_compare.gos "$BASELINE" "$CURRENT"

      - name: Update baseline on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          # The cache restore key gives PRs the latest accepted main baseline
          # for this CPU model. Keep it representative of current main, not
          # the fastest run ever seen on a matching hosted runner.
          CURRENT=.perf/current.txt
          BASELINE=.perf/baseline.txt
          cp "$CURRENT" "$BASELINE"

      - name: Save updated baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache@v6
        with:
          path: .perf/baseline.txt
          key: perf-baseline-${{ runner.os }}-${{ steps.perf_cpu.outputs.fingerprint }}-${{ github.sha }}

      - name: Upload perf log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-log
          path: .perf/

  # Cross-platform native-binary perf gate. The `perf` job above only times
  # `gos run FILE` execution on Linux; this one builds a `gos build --release` native binary
  # on all three Tier-1 platforms and times it, so an allocator/codegen
  # regression (or a tier silently degrading to the interpreter) is visible on
  # macOS and Windows too - not just Linux.
  perf-native:
    name: Perf native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          # `llvm.sh` is the LLVM project's own apt repository installer.
          # Ubuntu's archive stops several majors short of the one this
          # toolchain prefers, and the emitted IR's optimiser has to be
          # the major `rustc` bundles for its bitcode to be readable at
          # all - a mismatch there is a hard link error, not a slower
          # build.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

          echo "GOS_LLC=/usr/bin/llc-18" >> "$GITHUB_ENV"
          echo "GOS_LLVM_OPT=/usr/bin/opt-18" >> "$GITHUB_ENV"
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install llvm@22
          prefix="$(brew --prefix llvm@22)"
          echo "GOS_LLVM_OPT=$prefix/bin/opt" >> "$GITHUB_ENV"
          echo "GOS_LLC=$prefix/bin/llc"      >> "$GITHUB_ENV"
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-LlvmTool($name) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($dir in @('C:\msys64\mingw64\bin', 'C:\msys64\clang64\bin')) {
              $cand = Join-Path $dir $name
              if (Test-Path $cand) { return $cand }
            }
            return $null
          }
          $opt = Find-LlvmTool 'opt.exe'
          $llc = Find-LlvmTool 'llc.exe'
          if (-not $opt -or -not $llc) {
            & 'C:\msys64\usr\bin\pacman.exe' -S --noconfirm --needed mingw-w64-x86_64-llvm
            $opt = Find-LlvmTool 'opt.exe'
            $llc = Find-LlvmTool 'llc.exe'
          }
          if (-not $opt -or -not $llc) { throw "opt.exe/llc.exe not found after MSYS2 install" }
          "GOS_LLVM_OPT=$opt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GOS_LLC=$llc"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@1.95.0
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-perf-native

      - name: Resolve cargo binary (shim guard)
        shell: bash
        run: |
          set -euo pipefail
          resolved_cargo="$("$HOME/.cargo/bin/rustup" which cargo)"
          echo "CARGO_BIN=$resolved_cargo" >> "$GITHUB_ENV"

      - name: Build release `gos`
        shell: bash
        run: |
          "$CARGO_BIN" build --release -p gossamer-cli

      - name: Assert release profile wins on a paired native workload
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_BIN" test -p gossamer-cli --test release_perf -- --nocapture

      - name: Build + time native binary
        shell: bash
        run: |
          set -euo pipefail
          GOS=./target/release/gos
          [ -x "$GOS" ] || GOS=./target/release/gos.exe
          SRC=examples/factorial.gos
          mkdir -p .perf
          rm -f .perf/native-current.txt

          # Build the native binary (the path this gate exists to cover).
          "$GOS" build --release "$SRC"
          BIN="$(find examples -type f \( -name factorial -o -name factorial.exe \) \
                  -newer "$SRC" 2>/dev/null | head -n1)"
          [ -n "$BIN" ] || { echo "native binary not produced for $SRC"; exit 1; }

          start=$(date +%s%N)
          "$BIN" >/dev/null 2>&1
          end=$(date +%s%N)
          echo "native_factorial $((end - start))" | tee -a .perf/native-current.txt

      - name: Hard wall-clock cap (20 s)
        shell: bash
        run: |
          set -euo pipefail
          awk '{ if ($2 > 20000000000) {
                   print "PERF ABORT: " $1 " took " int($2/1000000) "ms (> 20 s cap)"; exit 1 } }' \
            .perf/native-current.txt

      - name: Upload native perf log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-native-log-${{ matrix.os }}
          path: .perf/native-current.txt
