name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs_src/**'
      - 'landing/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
      - 'crates/gossamer-playground/**'
  workflow_dispatch:

env:
  # Pin the rustup proxy to the project toolchain and suppress the
  # rust-toolchain.toml override read, matching ci.yml. Without this the
  # proxy dispatches cargo to 1.95.0 (per the override file) while the
  # wasm32-unknown-unknown target below is installed onto the toolchain
  # named by the rust-toolchain action - the two must be the same
  # toolchain or the target is invisible to the build.
  RUSTUP_TOOLCHAIN: 1.95.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only `main` publishes, including a manual run started elsewhere.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install mkdocs + Material theme
        # mkdocs.yml uses `theme: material`, the pymdownx extensions, and a
        # Pygments lexer in `mkdocs_hooks.py`. `mkdocs-material` pulls
        # mkdocs, Pygments, and pymdown-extensions; the latter is named
        # explicitly so the extensions are guaranteed present.
        run: pip install mkdocs-material pymdown-extensions
      - name: Assemble landing page at site root
        run: |
          mkdir -p site
          cp -r landing/. site/
      - name: Build mkdocs into site/docs/
        run: mkdocs build --strict --site-dir site/docs
      # Compile the Try Gossamer playground (the bytecode VM) to wasm and
      # drop the wasm-bindgen module into site/playground/, replacing the
      # JS stub the component falls back to when the module is absent.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Resolve wasm-bindgen-cli version from Cargo.lock
        # The CLI version must match the wasm-bindgen crate version exactly
        # (a mismatch is a hard "schema version" error), so pin it to whatever
        # Cargo.lock resolves rather than a floating range.
        run: |
          WBVER=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "pinning wasm-bindgen-cli to $WBVER"
          echo "WBVER=$WBVER" >> "$GITHUB_ENV"
      # Install the exact pinned version as a prebuilt binary (GitHub
      # Releases) - avoids compiling wasm-bindgen-cli from crates.io.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WBVER }}
      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build playground wasm
        run: |
          cargo build --release --target wasm32-unknown-unknown -p gossamer-playground
          wasm-bindgen target/wasm32-unknown-unknown/release/gossamer_playground.wasm \
            --out-dir site/playground --target web
          wasm-opt -Oz \
            --enable-bulk-memory --enable-nontrapping-float-to-int \
            --enable-sign-ext --enable-mutable-globals \
            --enable-multivalue --enable-reference-types \
            -o site/playground/gossamer_playground_bg.wasm \
            site/playground/gossamer_playground_bg.wasm
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      # The Pages backend can transiently reject an otherwise-valid publish
      # ("Deployment failed, try again later."). The uploaded artifact and the
      # deployment are idempotent, so re-attempt once before failing the job.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
