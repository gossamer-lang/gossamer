name: Miri

# Weekly nightly miri run on a curated subset of the test suite.
# Miri executes Rust at the MIR-interpreter level, catching UB
# (uninitialised reads, dangling pointers, alignment violations,
# data races on shared atomics) that escape compile-time and
# integration-test checks. Recent bug discoveries - invalid IR
# bitcasts, wild pointers passed to `chan_send`, single-slot
# alloca overflows - are exactly the class miri surfaces early.
#
# Run weekly rather than per-PR because miri is ~50× slower than
# native test execution and most fixes don't need that signal on
# every commit. Manual `workflow_dispatch` lets maintainers force
# a run before risky merges.

on:
  schedule:
    # Sundays 04:00 UTC - quiet window, doesn't compete with the
    # weekly fuzz cron at 03:00.
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # See ci.yml for the full explanation. rustup proxies are not
  # concurrent-safe (rustup#988); RUSTUP_TOOLCHAIN suppresses the
  # rust-toolchain.toml override-file read in every proxy
  # invocation, eliminating the rust-src download race. Miri
  # requires nightly; we pin a specific date so the build is
  # reproducible (`miri` and `-Z` flags shift across nightlies).
  # Must match `toolchain:` on the dtolnay step.
  RUSTUP_TOOLCHAIN: nightly-2026-04-14

jobs:
  miri:
    name: Miri (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Allow long wall-clock; the largest crate (gossamer-runtime)
    # runs ~30 minutes under miri because every alloc path goes
    # through the interpreter.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Crates picked for highest UB-surface density. Excluded:
        # gossamer-cli (drives subprocesses miri can't observe),
        # gossamer-codegen-llvm / -cranelift (emit IR that's
        # off-MIR by design), gossamer-pkg / gossamer-lsp (mostly
        # I/O glue). The fundamental memory-safety crates are
        # in-scope.
        include:
          - shard: compiler
            crates: gossamer-mir gossamer-types gossamer-resolve
          - shard: runtime
            crates: gossamer-runtime gossamer-coro gossamer-sched
            integration: >-
              vec_swap vec_reserve vec_flat_elements vec_owned_children string_append
              string_case strconv_bytes foreign_string_prefix user_ordered_map
              user_ordered_set
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-14
          components: miri
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-miri-${{ matrix.shard }}
      - name: Run miri
        env:
          # Miri flags:
          # - `-Zmiri-disable-isolation`: allow time, env, fs
          #   reads - the runtime crate inspects clocks and env
          #   for the GC-mode toggle.
          # - `-Zmiri-permissive-provenance`: allow ptr-int-ptr
          #   roundtrips used by the runtime's flat-slot ABI.
          # - `-Zmiri-ignore-leaks`: the GC heap leaks by design
          #   under tests that don't run a full collection cycle.
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-permissive-provenance -Zmiri-ignore-leaks
          RUST_BACKTRACE: "full"
        run: |
          # Every crate in the shard runs even when an earlier one fails, so
          # one failure never hides the rest of the shard's signal.
          failed=""
          for crate in ${{ matrix.crates }}; do
            cargo miri test -p "$crate" --lib --no-fail-fast -- --nocapture --test-threads=1 \
              || failed="$failed $crate"
          done
          # The runtime's `vec`, `string`, and `map` integration suites drive the
          # C-ABI shims the way compiled code does, so they run here too.
          if [ -n "${{ matrix.integration }}" ]; then
            for suite in ${{ matrix.integration }}; do
              cargo miri test -p gossamer-runtime --test "$suite" --no-fail-fast -- --test-threads=1 \
                || failed="$failed $suite"
            done
          fi
          if [ -n "$failed" ]; then
            echo "miri failed for:$failed"
            exit 1
          fi
