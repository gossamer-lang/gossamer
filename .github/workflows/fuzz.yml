name: Fuzz smoke

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fuzz harnesses link against libfuzzer, which uses its own
  # uninit-memory + ODR rules; the workspace `-D warnings` is too
  # strict for the libfuzzer-generated entry points.
  RUSTFLAGS: ""
  # See ci.yml for the full explanation. rustup proxies are not
  # concurrent-safe (rustup#988); RUSTUP_TOOLCHAIN suppresses the
  # rust-toolchain.toml override-file read in every proxy
  # invocation, eliminating the rust-src download race. cargo-fuzz
  # requires nightly; we pin a specific date so the build is
  # reproducible (rolling `nightly` regularly breaks fuzz/miri/
  # sanitizers). Bump deliberately, not via drift - must match
  # `toolchain:` on the dtolnay step and the `+<toolchain>` flag
  # on every cargo invocation below.
  RUSTUP_TOOLCHAIN: nightly-2026-04-14
  # Disable HTTP/2 multiplexing. Some GitHub Actions runners have a
  # curl build where the HTTP/2 framing layer fails transiently
  # (curl error 16), causing registry fetches to error out. Forcing
  # HTTP/1.1 avoids the framing layer entirely at negligible cost.
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-14
      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-fuzz
          workspaces: fuzz
      # Install cargo-fuzz as a prebuilt binary (GitHub Releases via
      # cargo-binstall) - avoids compiling its full dependency tree
      # from crates.io on every cache miss.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Smoke each seed corpus for 30 s
        working-directory: fuzz
        # Mirror fuzz-weekly.yml's rss / malloc / timeout caps so
        # a single pathological seed can't OOM the runner. 30 s of
        # smoke fuzz isn't long enough to provoke OOM on its own,
        # but cargo + the harness + the cached corpus still push
        # well into hundreds of MB; the explicit limits keep the
        # smoke job deterministic.
        # --target x86_64-unknown-linux-gnu is required: newer cargo-fuzz
        # prebuilts default to the musl triple which is incompatible with
        # ASAN (-Zsanitizer=address requires -C target-feature=-crt-static
        # on musl, but cargo-fuzz does not set that flag).
        run: |
          set -euo pipefail
          for target in lex parse manifest http_request typecheck mir_lower vm_compile resolve hir_lower vm_run; do
            cargo +nightly-2026-04-14 fuzz run --target x86_64-unknown-linux-gnu \
              "$target" \
              -- -max_total_time=30 -max_len=65536 \
                 -rss_limit_mb=2048 -malloc_limit_mb=2048 -timeout=30
          done
      - name: Upload any crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
