name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # See ci.yml for the full explanation. rustup proxies are not
  # concurrent-safe (rustup#988); build scripts in proc-macro deps
  # invoke `rustc` through the shim in parallel, each shim reads
  # rust-toolchain.toml, and the override-file consistency check
  # trips into a rust-src channel re-sync that races on file rename.
  # RUSTUP_TOOLCHAIN suppresses the override-file read entirely,
  # making the shim a pure pass-through to the named toolchain.
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read workspace version
        shell: bash
        run: |
          VERSION="$(awk -F'"' '
            /^\[workspace\.package\]$/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 ~ /^version = / { print $2; exit }
          ' Cargo.toml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.95.0

      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --bin gos

      # Install packaging tools as prebuilt binaries (cargo-deb from
      # GitHub Releases, cargo-generate-rpm via cargo-binstall) - avoids
      # compiling them from crates.io on every cache miss.
      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Stage tarball payload
        run: |
          BASE="gos-${VERSION}-linux-x86_64"
          mkdir "$BASE"
          cp target/release/gos "$BASE/"
          cp target/release/libgossamer_runtime.a "$BASE/"
          cp README.md LICENSE "$BASE/"
          cp scripts/install.sh "$BASE/"
          chmod +x "$BASE/install.sh"
          tar -czf "${BASE}.tar.gz" "$BASE"

      # Fully static musl build of the toolchain, shipped alongside the
      # glibc build for distro-independent use. `gos` links no libLLVM (it
      # shells out to llc/opt), so the only native code is Rust plus a few
      # C deps (mimalloc, ring, zstd); `musl-tools`' musl-gcc supplies the
      # sysroot. No zig or cross toolchain is needed for the native
      # x86_64 target - zig is only used for the aarch64 cross-musl case.
      # A position-independent executable carries its pointer constants as
      # load-time relocations, so the dynamic linker writes ~1.9 MB of them
      # into private dirty pages before `main` runs. Fixing the load address
      # moves those into read-only, file-backed pages and starts every `gos`
      # process about 3 MB lower, at identical execution speed. This lives
      # here rather than in `.cargo/config.toml` because it must never reach
      # the host build scripts and proc macros - cargo only draws that line
      # when the build names its target, which every build below does, and a
      # `[target.<triple>]` entry would also apply to a runner whose host IS
      # that triple (the aarch64 test matrix).
      - name: Build static musl binary
        env:
          RUSTFLAGS: -C relocation-model=static
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --release --target x86_64-unknown-linux-musl --bin gos
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --release --target x86_64-unknown-linux-musl -p gossamer-runtime
          cp target/x86_64-unknown-linux-musl/release/libgossamer_runtime.a \
             target/release/libgossamer_runtime-musl.a
          BASE="gos-${VERSION}-linux-x86_64"
          cp target/release/libgossamer_runtime-musl.a \
             "$BASE/libgossamer_runtime-musl.a"
          tar -czf "${BASE}.tar.gz" "$BASE"

      - name: Stage static musl tarball
        run: |
          BASE="gos-${VERSION}-linux-x86_64-musl"
          mkdir "$BASE"
          cp target/x86_64-unknown-linux-musl/release/gos "$BASE/"
          cp target/x86_64-unknown-linux-musl/release/libgossamer_runtime.a "$BASE/"
          cp target/x86_64-unknown-linux-musl/release/libgossamer_runtime.a \
             "$BASE/libgossamer_runtime-musl.a"
          cp README.md LICENSE "$BASE/"
          cp scripts/install.sh "$BASE/"
          chmod +x "$BASE/install.sh"
          tar -czf "${BASE}.tar.gz" "$BASE"

      - name: Build .deb
        run: |
          cargo deb --no-build -p gossamer-cli
          mv target/debian/*.deb .

      - name: Build .rpm
        run: |
          cargo generate-rpm -p crates/gossamer-cli
          mv target/generate-rpm/*.rpm .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gos-linux-x86_64
          path: |
            gos-*-linux-x86_64.tar.gz
            gos-*-linux-x86_64-musl.tar.gz
            *.deb
            *.rpm

  build-linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read workspace version
        shell: bash
        run: |
          VERSION="$(awk -F'"' '
            /^\[workspace\.package\]$/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 ~ /^version = / { print $2; exit }
          ' Cargo.toml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl

      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: aarch64

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # `llvm.sh` is the LLVM project's own apt repository installer.
          # Ubuntu's archive stops several majors short of the one this
          # toolchain prefers, and the emitted IR's optimiser has to be
          # the major `rustc` bundles for its bitcode to be readable at
          # all - a mismatch there is a hard link error, not a slower
          # build.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"


      - name: Install zig
        # Bare `clang --target=aarch64-unknown-linux-musl` (the previous
        # approach here) has no musl sysroot and fails to find `string.h`
        # - see the cross-from-linux job in ci.yml for the full story,
        # including why a hand-rolled `CC=zig cc` doesn't work either and
        # `cargo zigbuild` is used instead. Installed via direct download,
        # not `mlugg/setup-zig`: that action both runs on a deprecated
        # Node 20 and 404s fetching any current Zig release.
        run: |
          set -euo pipefail
          zig_ver=0.16.0
          curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${zig_ver}/zig-x86_64-linux-${zig_ver}.tar.xz"
          mkdir -p /tmp/zig-install
          tar -xf /tmp/zig.tar.xz -C /tmp/zig-install --strip-components=1
          echo "/tmp/zig-install" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # A position-independent executable carries its pointer constants as
      # load-time relocations, so the dynamic linker writes ~1.9 MB of them
      # into private dirty pages before `main` runs. Fixing the load address
      # moves those into read-only, file-backed pages and starts every `gos`
      # process about 3 MB lower, at identical execution speed. This lives
      # here rather than in `.cargo/config.toml` because it must never reach
      # the host build scripts and proc macros - cargo only draws that line
      # when the build names its target, which every build below does, and a
      # `[target.<triple>]` entry would also apply to a runner whose host IS
      # that triple (the aarch64 test matrix).
      - name: Build
        env:
          RUSTFLAGS: -C relocation-model=static
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu --bin gos
          # The CLI build script builds the runtime staticlib for the host;
          # `gos build` on aarch64 needs the aarch64 archive, so build it for
          # the target explicitly into target/<triple>/release/.
          cargo build --release --target aarch64-unknown-linux-gnu -p gossamer-runtime
          # Static-musl runtime for `gos build --release` static binaries on a
          # Pi (the gnu cross gcc only knows the glibc sysroot, so this leg
          # needs zig's bundled musl sysroot instead).
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p gossamer-runtime
          cp target/aarch64-unknown-linux-musl/release/libgossamer_runtime.a \
             target/aarch64-unknown-linux-gnu/release/libgossamer_runtime-musl.a

      # Install packaging tools as prebuilt binaries (cargo-deb from
      # GitHub Releases, cargo-generate-rpm via cargo-binstall) - avoids
      # compiling them from crates.io on every cache miss.
      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Stage tarball payload
        run: |
          BASE="gos-${VERSION}-linux-aarch64"
          mkdir "$BASE"
          cp target/aarch64-unknown-linux-gnu/release/gos "$BASE/"
          cp target/aarch64-unknown-linux-gnu/release/libgossamer_runtime.a "$BASE/"
          # Static-musl runtime, shipped alongside the gnu one so a Pi
          # `gos build --release` can produce a self-contained static binary.
          cp target/aarch64-unknown-linux-musl/release/libgossamer_runtime.a \
             "$BASE/libgossamer_runtime-musl.a"
          cp README.md LICENSE "$BASE/"
          cp scripts/install.sh "$BASE/"
          chmod +x "$BASE/install.sh"
          tar -czf "${BASE}.tar.gz" "$BASE"

      - name: Build .deb
        run: |
          cargo deb --no-build --target aarch64-unknown-linux-gnu -p gossamer-cli
          mv target/aarch64-unknown-linux-gnu/debian/*.deb .

      - name: Build .rpm
        run: |
          cargo generate-rpm --target aarch64-unknown-linux-gnu -p crates/gossamer-cli
          mv target/aarch64-unknown-linux-gnu/generate-rpm/*.rpm .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gos-linux-aarch64
          path: |
            gos-*-linux-aarch64.tar.gz
            *.deb
            *.rpm

  # The default archives (`macos-<arch>`) run on macOS 15 and later; the
  # `macos12-<arch>` ones on macOS 12 and later. Each is compiled for the
  # oldest CPU its macOS runs on: every Intel Mac macOS 15 supports has AVX2
  # (x86-64-v3), while macOS 12 still runs on the 2013 Mac Pro (x86-64-v2).
  # A `gos` targets, by default, the macOS it was built for.
  build-macos:
    name: macOS ${{ matrix.macos }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: xcode-27
            target: aarch64-apple-darwin
            macos: "15.0"
            cpu: apple-m1
            asset: macos
          - arch: x86_64
            runner: xcode-27
            target: x86_64-apple-darwin
            macos: "15.0"
            cpu: x86-64-v3
            asset: macos
          - arch: aarch64
            runner: xcode-27
            target: aarch64-apple-darwin
            macos: "12.0"
            cpu: apple-m1
            asset: macos12
          - arch: x86_64
            runner: xcode-27
            target: x86_64-apple-darwin
            macos: "12.0"
            cpu: x86-64-v2
            asset: macos12
    steps:
      - uses: actions/checkout@v6

      - name: Read workspace version
        shell: bash
        run: |
          VERSION="$(awk -F'"' '
            /^\[workspace\.package\]$/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 ~ /^version = / { print $2; exit }
          ' Cargo.toml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.asset }}-${{ matrix.arch }}

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        run: |
          cargo build --release --target ${{ matrix.target }} --bin gos
          # `gos build` needs the runtime archive matching the binary's arch;
          # the x86_64 leg cross-compiles from the arm64 runner, so build the
          # runtime for the target explicitly.
          cargo build --release --target ${{ matrix.target }} -p gossamer-runtime

      # Neither `gos` nor any object in the runtime archive programs link may
      # ask for a macOS newer than the one this archive is for.
      - name: Check the artifacts run on macOS ${{ matrix.macos }}
        env:
          MACOS: ${{ matrix.macos }}
        run: |
          dir=target/${{ matrix.target }}/release
          newest=$( { otool -l "$dir/gos"; otool -l "$dir/libgossamer_runtime.a"; } |
            awk '$1 == "minos" { print $2 }' | sort -V | tail -1)
          echo "newest minimum macOS: $newest"
          [ -n "$newest" ]
          [ "$(printf '%s\n%s\n' "$newest" "$MACOS" | sort -V | tail -1)" = "$MACOS" ]

      - name: Package zip
        run: |
          BASE="gos-${VERSION}-${{ matrix.asset }}-${{ matrix.arch }}"
          mkdir "$BASE"
          cp target/${{ matrix.target }}/release/gos "$BASE/"
          cp target/${{ matrix.target }}/release/libgossamer_runtime.a "$BASE/"
          cp README.md LICENSE "$BASE/"
          cp scripts/install.sh "$BASE/"
          chmod +x "$BASE/install.sh"
          codesign --force --sign - --timestamp=none "$BASE/gos"
          zip -r "${BASE}.zip" "$BASE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gos-${{ matrix.asset }}-${{ matrix.arch }}
          path: gos-*-${{ matrix.asset }}-${{ matrix.arch }}.zip

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read workspace version
        shell: bash
        run: |
          VERSION="$(awk -F'"' '
            /^\[workspace\.package\]$/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 ~ /^version = / { print $2; exit }
          ' Cargo.toml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.95.0

      - run: rustup set profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --bin gos

      - name: Stage zip payload
        shell: pwsh
        run: |
          $base = "gos-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          Copy-Item target\release\gos.exe "$base\"
          Copy-Item target\release\gossamer_runtime.lib "$base\"
          Copy-Item README.md, LICENSE "$base\"
          Compress-Archive -Path "$base\*" -DestinationPath "$base.zip"

      - name: Render Inno Setup script
        shell: pwsh
        run: |
          $iss = Get-Content resources\windows\gos-setup.iss.in -Raw
          $iss = $iss -replace '@VERSION@', $env:VERSION
          $iss = $iss -replace '@SOURCE_DIR@', ($PWD.Path -replace '\\', '/')
          $iss | Set-Content resources\windows\gos-setup.iss -Encoding utf8

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe'
          }
          & $iscc /Qp resources\windows\gos-setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          Move-Item resources\windows\gos-*-setup.exe . -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gos-windows-x86_64
          path: |
            gos-*-windows-x86_64.zip
            gos-*-setup.exe

  # FreeBSD has no hosted runner, so the release builds in a FreeBSD VM on a
  # Linux runner; the archive is copied back to the runner for upload.
  build-freebsd:
    name: FreeBSD x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read workspace version
        shell: bash
        run: |
          VERSION="$(awk -F'"' '
            /^\[workspace\.package\]$/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 ~ /^version = / { print $2; exit }
          ' Cargo.toml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and package in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 14336
          envs: VERSION RUSTUP_TOOLCHAIN
          prepare: |
            pkg install -y bash git cmake gmake pkgconf curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
          run: |
            . "$HOME/.cargo/env"
            cargo build --release --bin gos
            BASE="gos-${VERSION}-freebsd-x86_64"
            mkdir "$BASE"
            cp target/release/gos target/release/libgossamer_runtime.a "$BASE/"
            cp README.md LICENSE scripts/install.sh "$BASE/"
            chmod +x "$BASE/install.sh"
            tar -czf "${BASE}.tar.gz" "$BASE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gos-freebsd-x86_64
          path: gos-*-freebsd-x86_64.tar.gz

  publish:
    name: Publish release
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos, build-windows, build-freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.exe' \) \
            -exec mv {} release/ \;

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/gossamer-sbom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Mint the GitHub Actions OIDC token explicitly and feed it to
      # cosign via COSIGN_IDENTITY_TOKEN. Cosign's "ambient" OIDC
      # detection has been observed to fail on hosted runners with
      # `fetching ambient OIDC credentials: invalid character 'u'
      # looking for beginning of value` - the provider is fetching
      # the token URL and getting a plain-text error body. Going
      # through `actions/github-script` skips the ambient probe.
      - name: Mint OIDC token for cosign
        id: oidc
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('sigstore');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Sign every artifact (keyless / OIDC)
        env:
          COSIGN_IDENTITY_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          cd release
          : > SHA256SUMS
          for art in *.tar.gz *.zip *.deb *.rpm *.exe gossamer-sbom.cdx.json; do
            [ -f "$art" ] || continue
            cosign sign-blob --yes \
              --output-signature "$art.sig" \
              --output-certificate "$art.pem" "$art"
            sha256sum "$art" >> SHA256SUMS
          done

      - name: SLSA-3 build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.rpm
            release/*.exe

      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.sig
            release/*.pem
            release/SHA256SUMS
            release/gossamer-sbom.cdx.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker/build-push-action@v6` with `provenance: true` /
      # `sbom: true` requires the `docker-container` builder driver;
      # the runner's default `docker` driver fails finalisation with
      # "Attestation is not supported for the docker driver". The
      # setup-buildx-action installs and selects `docker-container`.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR rejects mixed-case image names, but `github.repository_owner`
      # preserves the user's GitHub-account casing. Lowercase here
      # so the build does not silently fail on forks where the owner
      # ident is not all-lowercase.
      - name: Compute image tag
        id: img
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "tag=ghcr.io/${owner_lc}/gossamer:${GITHUB_REF_NAME}" \
            >> "$GITHUB_OUTPUT"

      - name: Build + push distroless Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: resources/docker/Dockerfile
          tags: ${{ steps.img.outputs.tag }}
          push: true
          provenance: true
          sbom: true
