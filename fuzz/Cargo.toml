[package]
name = "gossamer-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
path = "src/lib.rs"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1", features = ["derive"] }
gossamer-hir = { path = "../crates/gossamer-hir" }
gossamer-interp = { path = "../crates/gossamer-interp" }
gossamer-lex = { path = "../crates/gossamer-lex" }
gossamer-mir = { path = "../crates/gossamer-mir" }
gossamer-parse = { path = "../crates/gossamer-parse" }
gossamer-pkg = { path = "../crates/gossamer-pkg" }
gossamer-resolve = { path = "../crates/gossamer-resolve" }
gossamer-runtime = { path = "../crates/gossamer-runtime" }
gossamer-std = { path = "../crates/gossamer-std" }
gossamer-types = { path = "../crates/gossamer-types" }

# Keep `cargo fuzz` targets out of the workspace so plain
# `cargo build --workspace` does not try to compile them without the
# cargo-fuzz tooling installed.
[workspace]

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false

[[bin]]
name = "typecheck"
path = "fuzz_targets/typecheck.rs"
test = false
doc = false

[[bin]]
name = "mir_lower"
path = "fuzz_targets/mir_lower.rs"
test = false
doc = false

[[bin]]
name = "vm_compile"
path = "fuzz_targets/vm_compile.rs"
test = false
doc = false

[[bin]]
name = "resolve"
path = "fuzz_targets/resolve.rs"
test = false
doc = false

[[bin]]
name = "hir_lower"
path = "fuzz_targets/hir_lower.rs"
test = false
doc = false

[[bin]]
name = "vm_run"
path = "fuzz_targets/vm_run.rs"
test = false
doc = false

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
